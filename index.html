
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TK13Q12 - SnapFinder</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial,sans-serif;
}
.app{max-width:600px;margin:auto;padding:22px}
header{
 display:flex;justify-content:space-between;
 border-bottom:1px solid #492020;padding-bottom:20px;
}
.logo{color:#ff2020;font-size:25px;font-weight:900}
.logo span{color:white}
.status{color:#ff4545;font-size:11px}
.hero{text-align:center;margin:65px 0 40px}
.tag{color:#ff3434;font-size:10px;letter-spacing:4px}
h1{font-size:42px;margin:18px 0 8px}
h1 span{color:#ff2020}
.hero p{color:#777;font-size:13px}
.panel{
 background:#111;border:1px solid #492020;
 border-radius:12px;padding:22px;
 box-shadow:0 0 30px #3b000022;
}
label{color:#ff4545;font-size:11px;letter-spacing:2px}
.input-box{
 display:flex;align-items:center;background:#080808;
 border:1px solid #572020;padding:14px;margin:12px 0 18px;
}
.input-box span{color:red;margin-right:10px}
input{
 width:100%;background:transparent;border:0;
 outline:0;color:white;font-size:14px;
}
button{
 width:100%;padding:15px;background:#c90000;
 color:white;border:0;font-weight:bold;
 letter-spacing:2px;border-radius:5px;
}
.terminal{
 display:none;background:#050505;
 border:1px solid #3b1717;margin-top:25px;
 padding:15px;font-family:monospace;
}
.terminal-title{
 display:flex;justify-content:space-between;
 color:#ff3333;border-bottom:1px solid #321010;
 padding-bottom:10px;font-size:11px;
}
#logs{color:#ff6565;font-size:12px;line-height:2}
.result{display:none;margin-top:22px;text-align:center}
.success{color:#ff3535;font-weight:bold}
.notice{color:#999;font-size:11px;line-height:1.6}
.delete{margin-top:15px;background:#780000}
footer{
 text-align:center;color:#555;font-size:10px;
 margin-top:50px;letter-spacing:2px;
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">TK13Q12<span>.</span></div>
 <div class="status">● SYSTEM ONLINE</div>
</header>

<main>
<div class="hero">
 <div class="tag">CYBER SECURITY INTERFACE</div>
 <h1>SNAP<span>FINDER</span></h1>
 <p>Username analysis terminal</p>
</div>

<section class="panel">
<label for="username">TARGET USERNAME</label>
<div class="input-box">
 <span>@</span>
 <input id="username" placeholder="Enter Snapchat username"
 maxlength="30">
</div>

<button id="searchBtn">INITIALIZE SCAN</button>

<div id="terminal" class="terminal">
 <div class="terminal-title">
  <span>TERMINAL</span><span>TK13Q12</span>
 </div>
 <div id="logs"></div>
</div>

<div id="result" class="result">
 <div class="success">SIMULATION COMPLETE</div>
 <p id="resultName"></p>
 <p class="notice">
 Démonstration visuelle uniquement.
 Aucune donnée Snapchat réelle consultée.
 Aucun compte supprimé.
 </p>
 <button id="deleteBtn" class="delete">
 OPEN SNAPCHAT
 </button>
</div>
</section>
</main>

<footer>TK13Q12 © 2026 — CYBER INTERFACE</footer>
</div>

<script>
const searchBtn=document.getElementById("searchBtn");
const username=document.getElementById("username");
const terminal=document.getElementById("terminal");
const logs=document.getElementById("logs");
const result=document.getElementById("result");
const resultName=document.getElementById("resultName");
const deleteBtn=document.getElementById("deleteBtn");

let scanning=false;

searchBtn.addEventListener("click",async()=>{
 const pseudo=username.value.trim();

 if(!pseudo){
  alert("Entre un pseudo Snapchat !");
  return;
 }

 if(scanning)return;

 scanning=true;
 searchBtn.disabled=true;
 searchBtn.textContent="SCANNING...";
 terminal.style.display="block";
 result.style.display="none";
 logs.replaceChildren();

 const messages=[
  "[SYSTEM] Initializing terminal...",
  "[ACCESS] Simulation started...",
  "[SCAN] Analyzing username...",
  "[TRACE] Processing visual effects...",
  "[SYSTEM] Preparing results...",
  "[DONE] Simulation completed."
 ];

 for(const message of messages){
  const line=document.createElement("div");
  line.textContent=message;
  logs.appendChild(line);
  await new Promise(resolve=>setTimeout(resolve,700));
 }

 resultName.textContent="TARGET: @"+pseudo;
 result.style.display="block";
 searchBtn.textContent="SCAN AGAIN";
 searchBtn.disabled=false;
 scanning=false;
});

deleteBtn.addEventListener("click",()=>{
 window.location.href="https://www.snapchat.com/";
});

username.addEventListener("keydown",e=>{
 if(e.key==="Enter")searchBtn.click();
});
</script>
</body>
</html>
